upstream veritas_web {
    server 127.0.0.1:3060;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name scanwithveritas.tech www.scanwithveritas.tech;

    access_log /home/ubuntu/projects/veritas/logs/nginx-access.log;
    error_log /home/ubuntu/projects/veritas/logs/nginx-error.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scanwithveritas.tech www.scanwithveritas.tech;

    ssl_certificate /etc/letsencrypt/live/scanwithveritas.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scanwithveritas.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /home/ubuntu/projects/veritas/logs/nginx-access.log;
    error_log /home/ubuntu/projects/veritas/logs/nginx-error.log warn;

    client_max_body_size 20m;

    location / {
        proxy_pass http://veritas_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
